# To subscribe to the output: ros2 topic echo /chatter_fromuf

launch:

- arg:
    name: "no_shared_mem"
    default: "true"
    # doesnt work in galactic works in humble (https://github.com/ros2/launch/issues/524)
    #choices: ["true", "false"]

- arg:
    name: "topic"
    default: "chatter"
    # doesnt work in galactic works in humble (https://github.com/ros2/launch/issues/524)
    #choices: ["true", "false"]


- set_env:
    name: "RMW_IMPLEMENTATION"
    value: "rmw_fastrtps_cpp"
- set_env:
    if: "$(var no_shared_mem)"
    name: "MW_FASTRTPS_USE_QOS_FROM_XML"
    value: "1"
- set_env:
    if: "$(var no_shared_mem)"
    name: "FASTRTPS_DEFAULT_PROFILES_FILE"
    value: "$(find-pkg-share unique_flow_topic_relay)/config/no_shared_mem.xml"
    
# - node:
#     pkg: "turtlesim"
#     exec: "turtlesim_node"
#     name: "$(var topic)_listener"
#     remap:
#     -
#         from: "turtle1/pose"
#         to: "$(var topic)_touf"

#- executable:
#    cmd: "env"
#    output: "screen"

#$(var namespace)      
- node:
    pkg: "unique_flow_topic_relay"
    exec: "unique_flow_topic_relay_endpoint_namespace"
    name: "$(var topic)_topic_relay_endpoint"
    #launch-prefix: "xterm -e lldb -- "
    param:
    -
      name: "discovery_period"
      value: 1.0
    -
      name: "topic_names"
      # remap:
      # -
      #   from: ["$(var namespace)/tcp_tunnel_client/$(var topic)_fromuf"]
      #   to: "turtle/$(var topic)"
      # value: ["/turtle/$(var topic)"]
      value: ["/turtle/$(var topic)_fromuf"]
    -
      name: "from_uf_name"
      value: "_fromuf"
    -
      name: "uf_name"
      value: ""
    -
      name: "split_tunnel_suffixes"
      value:  ["_1","_2"]
    - 
      name: "namespaces"
      value: ["/pose_5G/tcp_tunnel_client", "/pose_ETH/tcp_tunnel_client"]
      # value: ["/$(var namespace)/tcp_tunnel_client"]
    

